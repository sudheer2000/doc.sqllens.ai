<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="issTitle issDesc">
  <title id="issTitle">Index Strategy Studio  three source tabs</title>
  <desc id="issDesc">Query Optimizer workbench showing Index Engine, AI Advisor, and 3 AI compare tabs with ranked index recommendations.</desc>
  <defs>
    <style type="text/css"><![CDATA[
      .bg{fill:#1e1e1e;}
      .panel{fill:#252526;stroke:#3c3c3c;}
      .tab{fill:#2d2d30;stroke:#3c3c3c;}
      .tab-active{fill:#1a73e8;stroke:#1a73e8;}
      .card{fill:#2a2a2a;stroke:#3c3c3c;}
      .card-top{fill:#1f2a1f;stroke:#34a853;}
      .ddl{fill:#0f172a;stroke:#1a73e8;}
      .lbl{fill:#e8e8e8;font-family:Segoe UI,system-ui,sans-serif;font-size:12px;font-weight:600;}
      .sub{fill:#9aa0a6;font-family:Segoe UI,system-ui,sans-serif;font-size:10px;}
      .mono{fill:#cbd5e1;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10px;}
      .chip{fill:#1a3a5c;stroke:#1a73e8;}
      .chip-t{fill:#8ab4f8;font-family:Segoe UI,system-ui,sans-serif;font-size:9px;}
      .btn{fill:#1a73e8;}
      .btn-t{fill:#fff;font-family:Segoe UI,system-ui,sans-serif;font-size:10px;font-weight:600;}
      .badge{fill:#34a853;}
      .badge-t{fill:#fff;font-family:Segoe UI,system-ui,sans-serif;font-size:9px;font-weight:600;}
    ]]></style>
  </defs>
  <rect class="bg" width="720" height="420" rx="8"/>
  <text class="lbl" x="20" y="28">Index Strategy Studio</text>
  <text class="sub" x="20" y="46">Index Engine · AI Advisor · 3 AI compare (LLMs)</text>
  <rect class="panel" x="16" y="58" width="688" height="346" rx="8"/>
  <rect class="tab" x="24" y="66" width="148" height="32" rx="6"/>
  <text class="sub" x="36" y="86">™ Index Engine</text>
  <text class="chip-t" x="148" y="86">3</text>
  <rect class="tab-active" x="176" y="66" width="148" height="32" rx="6"/>
  <text class="btn-t" x="188" y="86">( AI Advisor</text>
  <rect class="tab" x="328" y="66" width="188" height="32" rx="6"/>
  <text class="sub" x="340" y="86">=ó 3 AI compare (LLMs)</text>
  <rect class="btn" x="560" y="68" width="88" height="28" rx="6"/>
  <text class="btn-t" x="576" y="86">¶ Run Auto</text>
  <rect class="card" x="28" y="112" width="664" height="88" rx="8"/>
  <text class="lbl" x="40" y="134">#1 qo_customers(region, salary)</text>
  <text class="sub" x="40" y="152">Match with Index Engine:  Same recommendation · Confidence 92%</text>
  <text class="mono" x="40" y="172">CREATE INDEX idx_region_salary ON qo_customers (region, salary);</text>
  <rect class="card-top" x="28" y="212" width="664" height="108" rx="8"/>
  <rect class="badge" x="40" y="222" width="72" height="18" rx="4"/>
  <text class="badge-t" x="48" y="235">Top pick</text>
  <text class="lbl" x="120" y="236">Unanimous  3 sources agree</text>
  <rect class="ddl" x="40" y="248" width="640" height="56" rx="6"/>
  <text class="mono" x="52" y="268">DDL Index</text>
  <text class="mono" x="52" y="286">CREATE INDEX idx_region_salary ON qo_customers (region, salary);</text>
  <rect class="btn" x="572" y="330" width="108" height="30" rx="6"/>
  <text class="btn-t" x="588" y="350">Create Index</text>
  <rect class="chip" x="28" y="330" width="56" height="20" rx="4"/>
  <text class="chip-t" x="36" y="344">Same</text>
  <text class="sub" x="92" y="344">matches engine</text>
  <rect class="chip" x="200" y="330" width="56" height="20" rx="4"/>
  <text class="chip-t" x="208" y="344">Partial</text>
  <text class="sub" x="264" y="344">some agree</text>
</svg>
